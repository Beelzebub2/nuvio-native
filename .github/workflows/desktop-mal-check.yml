name: Check desktop MyAnimeList

on:
  pull_request:
    paths:
      - 'composeApp/src/**/features/myanimelist/**'
      - 'composeApp/src/**/features/watchorder/**'
      - 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerScreenRuntimeEffects.kt'
      - 'composeApp/src/desktopTest/kotlin/com/nuvio/app/features/myanimelist/**'
      - 'composeApp/build.gradle.kts'
      - '.github/workflows/desktop-mal-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-mal:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install WebView2 build SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4078.44 -OutputDirectory "$env:RUNNER_TEMP/nuget" -DirectDownload -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 SDK installation failed.' }
          "WEBVIEW2_ROOT=$env:RUNNER_TEMP/nuget/Microsoft.Web.WebView2.1.0.4078.44" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run MyAnimeList API, matching, and playback threshold regression tests
        shell: pwsh
        run: >-
          ./gradlew.bat :composeApp:desktopTest
          "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT"
          --tests '*MalClientTest*'
          --tests '*MalAutoMatchTest*'
          --tests '*MalPlaybackUpdateRulesTest*'
          '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx3072m'
          --max-workers=2 --no-configuration-cache --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-mal-test-results
          path: |
            composeApp/build/reports/tests/desktopTest/
            composeApp/build/test-results/desktopTest/
          if-no-files-found: warn
