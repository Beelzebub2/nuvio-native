name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, create a draft, or publish the release
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: ${{ inputs.mode }} desktop release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      current_bump: ${{ steps.release.outputs.current_bump }}
      previous_bump: ${{ steps.release.outputs.previous_bump }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        env:
          VERSION_FILE: composeApp/Configuration/DesktopVersion.properties
          VERSION_KEY: VERSION_NAME
          VERSION_FIRST_PARENT: "true"
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

          unexpected_changes="$(
            git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
              | grep -Ev '^(\.github/workflows/desktop-release\.yml|scripts/(generate-release-notes|release-metadata)\.sh)$' \
              || true
          )"
          if [[ -n "${unexpected_changes}" ]]; then
            echo "The desktop version bump must be the final application change before release." >&2
            echo "Unexpected files changed after the bump:" >&2
            echo "${unexpected_changes}" >&2
            exit 1
          fi

      - name: Generate repository release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          ./scripts/generate-release-notes.sh \
            --from "${PREVIOUS_BUMP}" \
            --to "${CURRENT_BUMP}" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-history \
            --exclude "${EXCLUDE_COMMITS}" \
            > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No desktop repository release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.version }} desktop release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ steps.release.outputs.version }}-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    if: inputs.mode != 'dry-run'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_SHA256: ${{ vars.MACOS_CERTIFICATE_SHA256 }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ vars.MACOS_NOTARY_TEAM_ID }}
      NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
      NUVIO_MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Fetch macOS runtime
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${MACOS_ARCH}/**" --exclude=""

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        run: |
          required_values=(
            LOCAL_PROPERTIES_BASE64
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_CERTIFICATE_SHA256
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_APP_PASSWORD
            MACOS_NOTARY_TEAM_ID
            NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE
            NUVIO_MACOS_SIGNING_IDENTITY
          )
          missing=()
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              missing+=("${value_name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required desktop release values: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Configure Apple signing and notarization
        run: |
          certificate_path="${RUNNER_TEMP}/nuvio-release.p12"
          keychain_path="${RUNNER_TEMP}/nuvio-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          chmod 600 "${certificate_path}"

          actual_sha256="$(
            openssl pkcs12 \
              -in "${certificate_path}" \
              -clcerts \
              -nokeys \
              -passin env:MACOS_CERTIFICATE_PASSWORD \
              | openssl x509 -noout -fingerprint -sha256 \
              | sed -E 's/^.*=//; s/://g' \
              | tr '[:upper:]' '[:lower:]'
          )"
          expected_sha256="$(
            printf '%s' "${MACOS_CERTIFICATE_SHA256}" \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [[ "${actual_sha256}" != "${expected_sha256}" ]]; then
            echo "The Apple signing certificate checksum does not match." >&2
            exit 1
          fi

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}" \
            | grep -F "${NUVIO_MACOS_SIGNING_IDENTITY}"

          xcrun notarytool store-credentials \
            "${NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE}" \
            --apple-id "${MACOS_NOTARY_APPLE_ID}" \
            --team-id "${MACOS_NOTARY_TEAM_ID}" \
            --password "${MACOS_NOTARY_APP_PASSWORD}" \
            --keychain "${keychain_path}" \
            --validate

          echo "NUVIO_MACOS_NOTARY_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Build, sign, and notarize DMG
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          ./gradlew \
            :composeApp:notarizeReleaseDmgWithKeychain \
            "-Pnuvio.macos.arch=${MACOS_ARCH}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Verify notarized DMG
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dmg_path="composeApp/build/compose/release-dmgs/Nuvio-macOS-${MACOS_ARCH}-${RELEASE_VERSION}.dmg"
          if [[ ! -f "${dmg_path}" ]]; then
            echo "Expected DMG was not produced: ${dmg_path}" >&2
            exit 1
          fi
          xcrun stapler validate "${dmg_path}"
          codesign --verify --strict --verbose=2 "${dmg_path}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg_path}"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}
          path: composeApp/build/compose/release-dmgs/Nuvio-macOS-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          keychain_path="${RUNNER_TEMP}/nuvio-release.keychain-db"
          if [[ -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi
          rm -f "${RUNNER_TEMP}/nuvio-release.p12"

  windows:
    name: Windows x64
    if: inputs.mode != 'dry-run'
    needs: metadata
    runs-on: windows-2022
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      WEBVIEW2_VERSION: 1.0.4078.44

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "Missing required desktop release value: LOCAL_PROPERTIES_BASE64" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            -Pcompose.desktop.packaging.checkJdkVendor=false `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace

      - name: Verify MSI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $msiPath = "composeApp\build\compose\release-msis\Nuvio-Windows-x64-$env:RELEASE_VERSION.msi"
          if (-not (Test-Path $msiPath)) {
            throw "Expected MSI was not produced: $msiPath"
          }

          $appJar = Get-ChildItem "composeApp\build\compose\binaries\main-release\app" `
            -Recurse `
            -Filter "composeApp-desktop-*.jar" `
            | Select-Object -First 1
          if ($null -eq $appJar) {
            throw "The packaged desktop application JAR was not found."
          }

          $jarEntries = & jar tf $appJar.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the packaged desktop application JAR."
          }
          $requiredEntries = @(
            "native/windows/player_bridge.dll",
            "native/windows/libmpv-2.dll",
            "native/windows/WebView2Loader.dll",
            "native/windows/vcruntime140.dll",
            "native/windows/msvcp140.dll",
            "native/windows/runtime-files.txt"
          )
          foreach ($entry in $requiredEntries) {
            if ($jarEntries -notcontains $entry) {
              throw "The packaged desktop application is missing $entry"
            }
          }

          Get-Item $msiPath | Format-List Name, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-windows-x64
          path: composeApp/build/compose/release-msis/Nuvio-Windows-x64-${{ needs.metadata.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create ${{ inputs.mode }} release
    if: inputs.mode != 'dry-run'
    needs:
      - metadata
      - macos
      - windows
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.release_commit }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nuvio-desktop-${{ needs.metadata.outputs.version }}-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          release_assets=(
            "release/Nuvio-macOS-arm64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-macOS-x86_64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-Windows-x64-${RELEASE_VERSION}.msi"
          )
          if [[ ! -s release/release-notes.md ]]; then
            echo "Release notes are missing." >&2
            exit 1
          fi

          : > release/SHA256SUMS.txt
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "Release asset is missing: ${asset}" >&2
              exit 1
            fi
            checksum="$(sha256sum "${asset}" | awk '{print $1}')"
            printf '%s  %s\n' "${checksum}" "$(basename "${asset}")" >> release/SHA256SUMS.txt
          done

          cat release/SHA256SUMS.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        run: |
          release_assets=(
            "release/Nuvio-macOS-arm64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-macOS-x86_64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-Windows-x64-${RELEASE_VERSION}.msi"
            "release/SHA256SUMS.txt"
          )
          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_COMMIT}"
            --title "${RELEASE_VERSION}"
            --notes-file release/release-notes.md
          )
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create "${release_args[@]}" "${release_assets[@]}"
