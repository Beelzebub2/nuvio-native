name: Check download storage safety

on:
  pull_request:
    paths:
      - 'composeApp/src/**/features/downloads/**'
      - 'composeApp/src/**/core/storage/**'
      - '.github/workflows/download-storage-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Install Linux player build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libxcomposite-dev libxext-dev xvfb
      - name: Test quota lifecycle and filesystem ownership
        run: >-
          xvfb-run -a ./gradlew :composeApp:desktopTest
          --tests '*DownloadStorageManagementTest*'
          --tests '*DownloadQuotaLifecycleTest*'
          --tests '*DownloadQueueTest*'
          --tests '*DesktopDownloadsTest*'
          '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx3072m'
          --max-workers=2 --no-configuration-cache --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: download-storage-test-results
          path: composeApp/build/test-results/desktopTest/
          if-no-files-found: warn
