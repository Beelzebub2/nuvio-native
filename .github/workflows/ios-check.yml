name: Check Starlit for iOS

on:
  pull_request:
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-kotlin:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        # The repository has legacy native gitlinks without .gitmodules URLs.
        # Kotlin/Native's iOS compile does not require those vendored submodules.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Provision checksum-verified Gradle 9.4.1
        shell: bash
        run: |
          set -euo pipefail
          # Fetch the pinned Gradle ZIP from Gradle's official distribution host.
          # GitHub's unauthenticated release asset API returns HTTP 403 on some
          # runners. Verify its published SHA256 before executing the archive.
          archive="$RUNNER_TEMP/gradle-9.4.1-bin.zip"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 900 \
            'https://downloads.gradle.org/distributions/gradle-9.4.1-bin.zip' \
            -o "$archive"
          printf '%s  %s\n' \
            '2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb' \
            "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/starlit-gradle"
          unzip -q "$archive" -d "$RUNNER_TEMP/starlit-gradle"
          binary="$RUNNER_TEMP/starlit-gradle/gradle-9.4.1/bin/gradle"
          test -x "$binary"
          echo "STARLIT_GRADLE_BIN=$binary" >> "$GITHUB_ENV"
      - name: Provision checksum-verified Kotlin Native compiler
        shell: bash
        run: |
          set -euo pipefail
          # Request the official, version-tagged Kotlin/Native release asset.
          # GitHub's unauthenticated release asset API can return HTTP 403;
          # the original asset URL redirects directly to the release CDN.
          # Keep verifying the published SHA256 before executing the compiler.
          archive="$RUNNER_TEMP/kotlin-native-prebuilt-2.4.10-macos-aarch64.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 900 \
            'https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-native-prebuilt-2.4.10-macos-aarch64.tar.gz' \
            -o "$archive"
          printf '%s  %s\n' \
            '55ded039bb56a69aec9df354a92b42df9e916104e3c53d8d9852d9cc6617ed9d' \
            "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/starlit-kotlin-native"
          tar -xzf "$archive" -C "$RUNNER_TEMP/starlit-kotlin-native"
          compiler="$(find "$RUNNER_TEMP/starlit-kotlin-native" -maxdepth 5 \
            -name kotlinc-native -print -quit)"
          if [[ -z "$compiler" || ! -x "$compiler" ]]; then
            echo '::error::Checksum-verified Kotlin Native archive has no executable compiler.'
            exit 1
          fi
          echo "KOTLIN_NATIVE_HOME=${compiler%/bin/kotlinc-native}" >> "$GITHUB_ENV"
      - name: Provision checksum-verified Kotlin compiler Maven artifact
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central serves the official POM and JAR directly. Verify the
          # published release asset SHA256 for the JAR before using the mirror.
          mirror="$RUNNER_TEMP/starlit-kotlin-maven"
          module="$mirror/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.10"
          mkdir -p "$module"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 90 \
            'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.10/kotlin-compiler-embeddable-2.4.10.pom' \
            -o "$module/kotlin-compiler-embeddable-2.4.10.pom"
          jar="$module/kotlin-compiler-embeddable-2.4.10.jar"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 900 \
            'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.10/kotlin-compiler-embeddable-2.4.10.jar' \
            -o "$jar"
          printf '%s  %s\n' \
            '9309638a2ee03e6bde9ef4b7444055a94b84ab906563675d71ff9aecb64da913' \
            "$jar" | shasum -a 256 --check
          echo "STARLIT_CI_KOTLIN_ARTIFACT_MIRROR=$mirror" >> "$GITHUB_ENV"
      - name: Compile iOS simulator Kotlin and Keychain interop
        run: >-
          "$STARLIT_GRADLE_BIN" :composeApp:compileKotlinIosSimulatorArm64
          "-Pkotlin.native.home=${KOTLIN_NATIVE_HOME}"
          '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx3072m'
          --no-configuration-cache --no-daemon --console=plain
