name: Check Starlit for iOS

on:
  pull_request:
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-kotlin:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        # The repository has legacy native gitlinks without .gitmodules URLs.
        # Kotlin/Native's iOS compile does not require those vendored submodules.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Download pinned Gradle with retries
        shell: bash
        run: |
          # Gradle's official distribution redirects through GitHub release assets,
          # which can transiently return 504 on fresh macOS runners. A download
          # failure is not a Kotlin failure; only retry the wrapper setup.
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo '::error::Gradle distribution remains unavailable after five attempts.'
              exit 1
            fi
            echo "::warning::Gradle distribution download failed; retry $((attempt + 1))/5."
            sleep "$((attempt * 20))"
          done
      - name: Compile iOS simulator Kotlin and Keychain interop
        run: >-
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64
          '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx3072m'
          --no-configuration-cache --no-daemon --console=plain
