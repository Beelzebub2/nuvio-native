name: Release Starlit

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    # Read-only: this job runs a third-party action; only the publish job may write the release.
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release requires a vMAJOR.MINOR.PATCH tag.' }
          $version = (Get-Content composeApp/Configuration/DesktopVersion.properties | Where-Object { $_ -match '^VERSION_NAME=' }) -replace '^VERSION_NAME=', ''
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match DesktopVersion.properties.' }
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Fetch pinned native Windows runtimes
        shell: pwsh
        run: |
          # Read the original public LFS store; a private clone need not duplicate its storage.
          git lfs fetch https://github.com/NuvioMedia/NuvioDesktop.git 25390defed025a871f6a3239427b4507f2fafb35 --include='composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime fetch failed.' }
          git lfs checkout
          $mpv = Get-Item composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll
          if ($mpv.Length -lt 1000000) { throw 'libmpv was not materialized.' }
          $torrent = 'composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe'
          if ((Get-FileHash $torrent -Algorithm SHA256).Hash.ToLowerInvariant() -ne '13031185a54abe0f729f9f3bdb7271a349a89ac8c559327d773c66007ed604f4') { throw 'Torrent engine checksum mismatch.' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate and extract current release notes
        shell: pwsh
        run: |
          node --test .github/release-notes.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release notes tests failed.' }
          node .github/release-notes.mjs extract docs/RELEASE-NOTES.md $env:RELEASE_TAG "$env:RUNNER_TEMP/current-release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Current release notes are missing, duplicated, or empty.' }
      - name: Install provider gateway test dependencies
        working-directory: gateway
        run: npm ci
      - name: Test provider gateway
        working-directory: gateway
        run: npm test
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP/nuget" -DirectDownload -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 SDK installation failed.' }
          "WEBVIEW2_ROOT=$env:RUNNER_TEMP/nuget/Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test and build the installer
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:desktopTest :composeApp:packageReleaseInstaller "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" '-Pcompose.desktop.packaging.checkJdkVendor=false' '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' '-Pkotlin.daemon.jvmargs=-Xmx3072m' --no-configuration-cache --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Tests or packaging failed.' }
      - name: Verify package and write checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem composeApp/build/compose/binaries/main-release/installer/*.exe)
          if ($packages.Count -ne 1) { throw 'Expected one executable installer.' }
          if ($packages[0].Length -lt 100000000) { throw 'Installer is too small to contain the native player and runtime.' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $name = "Starlit-Windows-x64-$env:RELEASE_VERSION.exe"
          Copy-Item -LiteralPath $packages[0].FullName -Destination "release/$name"
          $sha = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Smoke-test silent install and uninstall
        shell: pwsh
        run: |
          $installer = (Get-Item "release/Starlit-Windows-x64-$env:RELEASE_VERSION.exe").FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Starlit'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NuvioNative'
          $log = Join-Path $env:TEMP 'Starlit Setup.log'
          $run = Start-Process -FilePath $installer -ArgumentList '--silent', '--dir', "`"$dir`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Silent install failed with exit code $($run.ExitCode)." }
          foreach ($file in 'Starlit.exe', 'Uninstall Starlit.exe', 'app\Starlit.cfg') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "The installed app is missing $file." }
          }
          if ((Get-ItemProperty $key).DisplayVersion -ne $env:RELEASE_VERSION) { throw 'The Apps & Features entry has the wrong version.' }
          $run = Start-Process -FilePath (Join-Path $dir 'Uninstall Starlit.exe') -ArgumentList '--uninstall', '--silent' -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Silent uninstall failed with exit code $($run.ExitCode)." }
          Start-Sleep -Seconds 8
          if (Test-Path -LiteralPath $dir) { throw 'Uninstall left the install folder behind.' }
          if (Test-Path $key) { throw 'Uninstall left the Apps & Features entry behind.' }
      - uses: actions/upload-artifact@v7
        with:
          name: starlit-windows-release
          path: release/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate version tag
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' composeApp/Configuration/DesktopVersion.properties | tr -d '\r')
          code=$(sed -n 's/^VERSION_CODE=//p' composeApp/Configuration/DesktopVersion.properties | tr -d '\r')
          if [ "$RELEASE_TAG" != "v$version" ]; then echo "::error::Tag does not match DesktopVersion.properties"; exit 1; fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android compilation SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      # No secrets in this job: it runs third-party actions and Gradle init scripts. The APKs are
      # built unsigned and signed in android-sign, which runs only GitHub's own actions.
      - name: Build unsigned release APKs
        # The APK carries the release version so the in-app updater compares it with the release tag.
        run: >-
          ./gradlew :androidApp:assembleFullRelease
          -Pnuvio.android.distribution=full
          -Pnuvio.app.versionName=${RELEASE_VERSION}
          -Pnuvio.app.versionCode=${RELEASE_VERSION_CODE}
          '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
          '-Pkotlin.daemon.jvmargs=-Xmx3072m'
          --no-configuration-cache --no-daemon --console=plain
      - name: Name the unsigned APKs
        run: |
          mkdir -p unsigned
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "$(ls androidApp/build/outputs/apk/full/release/*-"$abi"-release-unsigned.apk)" "unsigned/Starlit-Android-$abi-$RELEASE_VERSION-unsigned.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: starlit-android-unsigned
          path: unsigned/*
          if-no-files-found: error
          retention-days: 1

  android-sign:
    # Only GitHub's own actions run here, so the signing key never shares a job with third-party code.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: starlit-android-unsigned
          path: unsigned
      - name: Sign and verify the APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::The $name secret is missing"; exit 1; fi
          done
          keystore="$RUNNER_TEMP/starlit-release.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # The runner image ships the Android build tools, so no setup action is needed here.
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          version="${RELEASE_TAG#v}"
          mkdir -p release
          # arm64-v8a first: it is the APK almost every phone needs.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            out="release/Starlit-Android-$abi-$version.apk"
            "$tools/zipalign" -f -p 4 "unsigned/Starlit-Android-$abi-$version-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify "$out"
          done
          rm -f release/*.idsig
          (cd release && sha256sum *.apk > SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: starlit-android-release
          path: release/*
          if-no-files-found: error

  publish:
    needs: [windows, android-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          # The signed Windows and Android outputs only, never the unsigned intermediate APKs.
          pattern: starlit-*-release
          path: release
          merge-multiple: true
      - name: Publish the release after every build passed
        run: |
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::This release already exists; do not overwrite published installers."; exit 1
          fi
          node .github/release-notes.mjs extract docs/RELEASE-NOTES.md "$RELEASE_TAG" "$RUNNER_TEMP/current-release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/published-releases.json"
          previous=$(node .github/release-notes.mjs previous "$RUNNER_TEMP/published-releases.json" "$RELEASE_TAG")
          cd release
          { tr -d '\r' < SHA256SUMS.txt; cat SHA256SUMS-android.txt; } > SHA256SUMS-all.txt
          mv SHA256SUMS-all.txt SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          args=(release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Starlit $version"
            --notes-file "$RUNNER_TEMP/current-release-notes.md")
          # With no published predecessor, publish only the authored notes: automatic tag inference can select failed tags.
          if [ -n "$previous" ]; then args+=(--generate-notes --notes-start-tag "$previous"); fi
          # arm64-v8a first: the in-app updater takes the first APK whose name matches the phone's ABI.
          gh "${args[@]}" "Starlit-Windows-x64-$version.exe" \
            "Starlit-Android-arm64-v8a-$version.apk" "Starlit-Android-armeabi-v7a-$version.apk" \
            "Starlit-Android-x86-$version.apk" "Starlit-Android-x86_64-$version.apk" \
            SHA256SUMS.txt
