name: starlit

# Linux host networking reaches the shared native PostgreSQL on loopback.
# Every HTTP listener also binds loopback; only cloudflared publishes the gateway.
x-service: &service
  network_mode: host
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  auth:
    <<: *service
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 127.0.0.1
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${STARLIT_SUPABASE_URL:?Set the public HTTPS root}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: ${AUTH_DATABASE_URL:?Set the auth database URL}
      DB_NAMESPACE: auth
      GOTRUE_SITE_URL: ${STARLIT_SUPABASE_URL}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_REDIRECT_URLS:-}
      # All account creation must pass an explicit owner approval. The public GoTrue
      # signup endpoint stays disabled even if the operator misconfigures runtime.env.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Generate a private JWT secret}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: ${STARLIT_SUPABASE_URL}/auth/v1
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: Starlit
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:9999/health]
      interval: 10s
      timeout: 5s
      retries: 6

  rest:
    <<: *service
    image: postgrest/postgrest:v16.5
    environment:
      PGRST_DB_URI: ${REST_DATABASE_URL:?Set the REST database URL}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_POOL: "10"
      PGRST_DB_CONFIG: "false"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_SERVER_HOST: 127.0.0.1
      PGRST_SERVER_PORT: "3100"
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: "3101"
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 10s
      timeout: 5s
      retries: 6

  discovery:
    <<: *service
    image: node:22.23.4-alpine3.23
    user: node
    working_dir: /app
    command: [node, discovery.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../discovery.mjs:/app/discovery.mjs:ro
    environment:
      HOST: 127.0.0.1
      PORT: "8787"
      STARLIT_SUPABASE_URL: ${STARLIT_SUPABASE_URL}
      STARLIT_SUPABASE_PUBLISHABLE_KEY: ${STARLIT_SUPABASE_PUBLISHABLE_KEY:?Generate the public anon key}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  signup:
    <<: *service
    image: node:22.23.4-alpine3.23
    user: node
    working_dir: /app
    command: [node, signup-service.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./signup-service.mjs:/app/signup-service.mjs:ro
      - ${SIGNUP_STATE_DIR:-/var/lib/starlit/signup}:/data
    environment:
      SIGNUP_PORT: "8789"
      SIGNUP_DB_PATH: /data/requests.sqlite
      STARLIT_SUPABASE_URL: ${STARLIT_SUPABASE_URL:?Set the public HTTPS root}
      AUTH_DISABLE_SIGNUP: "true"
      AUTH_EMAIL_AUTOCONFIRM: "false"
      JWT_SECRET: ${JWT_SECRET:?Generate a private JWT secret}
      SIGNUP_ENCRYPTION_KEY: ${SIGNUP_ENCRYPTION_KEY:?Set the independent signup encryption key}
      SIGNUP_NOTIFY_URL: ${SIGNUP_NOTIFY_URL:?Configure the notification Worker URL}
      SIGNUP_NOTIFY_TOKEN: ${SIGNUP_NOTIFY_TOKEN:?Configure the notification Worker token}
    depends_on:
      auth: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  gateway:
    <<: *service
    image: nginx:1.30.6-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_healthy }
      discovery: { condition: service_healthy }
      signup: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:8788/healthz]
      interval: 10s
      timeout: 5s
      retries: 3
