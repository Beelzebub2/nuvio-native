worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  # No query strings, tokens or email addresses in gateway access logs.
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  client_max_body_size 2m;
  # cloudflared is local; trust its verified client address only on loopback.
  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  server {
    listen 127.0.0.1:8788;
    add_header X-Content-Type-Options nosniff always;
    proxy_set_header Host $host;
    # The only ingress is the HTTPS Cloudflare Tunnel.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;

    location = /.well-known/nuvio { proxy_pass http://127.0.0.1:8787; }
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location = /auth/v1/health { proxy_pass http://127.0.0.1:9999/health; }
    # Administration is available only through GoTrue's separate loopback port.
    location ~ ^/auth/v1/(admin|invite)(/|$) { return 404; }
    # Sign-up creates an encrypted pending request, never a GoTrue account.
    location = /auth/v1/signup {
      limit_except POST { deny all; }
      client_max_body_size 16k;
      # Do not spool plaintext signup passwords into Nginx temporary files.
      client_body_buffer_size 16k;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      limit_req zone=auth burst=30 nodelay;
      proxy_pass http://127.0.0.1:8789;
    }
    # Possession of the one-use review token grants the owner a single decision.
    location = /admin/signups/review {
      # Nginx upstream/error diagnostics can include the full ?token= query;
      # never write this one-use owner capability into container logs.
      error_log /dev/null crit;
      limit_except GET POST { deny all; }
      limit_req zone=auth burst=30 nodelay;
      proxy_pass http://127.0.0.1:8789;
    }
    location /admin/ { return 404; }
    location /auth/v1/ {
      limit_req zone=auth burst=30 nodelay;
      proxy_pass http://127.0.0.1:9999/;
    }
    location /rest/v1/ { proxy_pass http://127.0.0.1:3100/; }
    location = / {
      default_type text/plain;
      return 200 'Starlit account server. You can close this page and sign in to Starlit.\n';
    }
    location / { return 404; }
  }
}
