  # Append to the existing services mapping in backend/vps/compose.yml.
  auth-login-analytics:
    <<: *service
    build: ./auth-login-analytics
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    group_add: ["101"]
    environment:
      AUTH_LOGIN_DATABASE_URL: ${AUTH_LOGIN_DATABASE_URL:?Provision restricted role first}
      AUTH_FAILED_LOG_PATH: /run/starlit/auth-failures.jsonl
      OPENOBSERVE_INGEST_URL: ${OPENOBSERVE_INGEST_URL:?Configure OpenObserve ingestion}
      OPENOBSERVE_INGEST_AUTH: ${OPENOBSERVE_INGEST_AUTH:?Configure OpenObserve ingestion}
      GEOIP_DB_PATH: /run/geoip/GeoLite2-City.mmdb
    volumes:
      - /etc/starlit/geoip/GeoLite2-City.mmdb:/run/geoip/GeoLite2-City.mmdb:ro
      - /var/log/starlit/auth-failures.jsonl:/run/starlit/auth-failures.jsonl:ro

  # Also append to the existing gateway service volumes:
  # - /var/log/starlit/auth-failures.jsonl:/var/log/nginx/auth-failures.jsonl
