# Place these three directives inside the existing http block,
# alongside the current safe log_format and maps. Do not log request bodies,
# query strings, refresh tokens, OAuth codes, email addresses or headers.
map $arg_grant_type $login_audit_grant {
  default unknown;
  password password;
  pkce pkce;
  id_token id_token;
  otp otp;
  webauthn webauthn;
  passkey passkey;
}
map "$request_method:$login_audit_grant:$status" $log_failed_login {
  default 0;
  ~^POST:(password|pkce|id_token|otp|webauthn|passkey):4[0-9][0-9]$ 1;
}
log_format auth_login_fail escape=json
  '{"request_id":"$request_id","at":"$time_iso8601","ip":"$remote_addr","grant":"$login_audit_grant","status":$status}';

# In the existing /auth/v1/token location retain the existing logging AND add:
# access_log /dev/stdout safe;
# access_log /var/log/nginx/auth-failures.jsonl auth_login_fail if=$log_failed_login;
#
# The file is bind-mounted from /var/log/starlit/auth-failures.jsonl with
# owner root:101 and mode 0660. The exporter reads it as a non-root member
# of group 101. logrotate uses copytruncate (see logrotate-auth.conf).
